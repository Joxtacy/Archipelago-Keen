name: Release apworld

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Release version (e.g. 0.0.5)"
        required: true
        type: string
      highlights:
        description: "Optional one-line summary shown at the top of the notes"
        required: false
        type: string

permissions:
  contents: write

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate version format
        run: |
          # Allow an optional prerelease suffix (e.g. 0.0.6-rc.1). A suffixed
          # version is published as a GitHub prerelease (see "Create release"),
          # so it stays off releases/latest and is safe to hand out for testing.
          if ! echo "${{ inputs.version }}" | grep -qE '^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$'; then
            echo "::error::Version must be semver, optionally with a prerelease suffix (e.g. 0.0.5 or 0.0.6-rc.1)"
            exit 1
          fi

      - name: Check tag does not already exist
        run: |
          if git rev-parse "v${{ inputs.version }}" >/dev/null 2>&1; then
            echo "::error::Tag v${{ inputs.version }} already exists"
            exit 1
          fi

      - name: Generate changelog (worlds/keen only)
        id: changelog
        env:
          HIGHLIGHTS: ${{ inputs.highlights }}
        run: |
          # Only commits touching worlds/keen — the rest of the repo is
          # upstream Archipelago and not part of this apworld release.
          # Exclude prerelease tags (anything with a hyphen, e.g. v0.0.6-rc.1) so a
          # final release's changelog spans the whole feature set, not just the
          # commits since the last RC.
          PREV_TAG=$(git describe --tags --abbrev=0 --match='v*' --exclude='*-*' 2>/dev/null || echo "")
          if [ -z "$PREV_TAG" ]; then RANGE="HEAD"; else RANGE="${PREV_TAG}..HEAD"; fi
          # Drop the self-referential "chore: release vX" bump commits.
          RAW=$(git log --pretty=format:"%s" "$RANGE" -- worlds/keen | grep -vE '^chore(\([^)]*\))?: release ' || true)

          # Bucket conventional commits by type and strip the "type(scope)!: "
          # prefix so the notes read like prose. Anything that isn't feat/fix
          # lands under Maintenance. `|| true` keeps `set -e` happy when a
          # bucket is empty.
          strip='s/^[a-z]+(\([^)]*\))?!?: //'
          NEW=$(printf '%s\n' "$RAW"   | grep -E '^feat(\([^)]*\))?!?:'        | sed -E "$strip" || true)
          FIX=$(printf '%s\n' "$RAW"   | grep -E '^fix(\([^)]*\))?!?:'         | sed -E "$strip" || true)
          OTHER=$(printf '%s\n' "$RAW" | grep -vE '^(feat|fix)(\([^)]*\))?!?:' | sed -E "$strip" || true)

          {
            echo "changelog<<CHANGELOG_EOF"
            [ -n "$HIGHLIGHTS" ] && printf '%s\n\n' "$HIGHLIGHTS"
            [ -n "$NEW" ]   && { echo "### ✨ New";         echo; printf '%s\n' "$NEW"   | sed 's/^/- /'; echo; }
            [ -n "$FIX" ]   && { echo "### 🐛 Fixed";       echo; printf '%s\n' "$FIX"   | sed 's/^/- /'; echo; }
            [ -n "$OTHER" ] && { echo "### 🔧 Maintenance"; echo; printf '%s\n' "$OTHER" | sed 's/^/- /'; echo; }
            echo "<details>"
            echo "<summary>Full commit changelog</summary>"
            echo
            printf '%s\n' "$RAW" | sed 's/^/- /'
            echo
            echo "</details>"
            echo "CHANGELOG_EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          check-latest: true

      - name: Install Archipelago dependencies
        run: |
          python -m pip install --upgrade pip
          python ModuleUpdate.py --yes --force --append "WebHostLib/requirements.txt"
          python Launcher.py --update_settings

      - name: Generate template YAML
        run: |
          python -c "
          import os
          from Options import generate_yaml_templates
          target = os.path.join('Players', 'Templates')
          os.makedirs(target, exist_ok=True)
          generate_yaml_templates(target, False)
          "
          # kodbyte's releases ship it as Commander.Keen.yaml (dots, not spaces).
          # Archipelago generates 'Commander Keen.yaml' by default; rename for parity.
          cp "Players/Templates/Commander Keen.yaml" Commander.Keen.yaml

      - name: Build keen.apworld
        run: |
          (cd worlds && \
            zip -r ../keen.apworld keen \
              -x 'keen/__pycache__/*' 'keen/**/__pycache__/*' 'keen/*.pyc' 'keen/**/*.pyc')

      - name: Tag and push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag "v${{ inputs.version }}"
          git push origin "v${{ inputs.version }}"

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: "v${{ inputs.version }}"
          name: "v${{ inputs.version }}"
          # A version with a prerelease suffix (e.g. 0.0.6-rc.1) is marked as a
          # prerelease so releases/latest keeps pointing at the last real release.
          prerelease: ${{ contains(inputs.version, '-') }}
          body: |
            ## 🌍 Commander Keen APWorld v${{ inputs.version }}

            The Archipelago world (`keen.apworld`) that generates randomized Commander Keen: Goodbye Galaxy seeds.

            ${{ steps.changelog.outputs.changelog }}

            📖 [About this implementation](https://github.com/${{ github.repository }}/blob/keen-ap/worlds/keen/docs/en_Commander_Keen.md) · [Setup Guide](https://github.com/${{ github.repository }}/blob/keen-ap/worlds/keen/docs/setup_en.md)

            ---

            ## 🎮 Part of the Commander Keen: Goodbye Galaxy Archipelago set

            Use matching versions of all three pieces together:

            - 🌍 **APWorld** — *this release* — generates the randomized game for Archipelago
            - 🕹️ [Game client (omnispeak-ap) — latest](https://github.com/Joxtacy/omnispeak-ap/releases/latest) — plays the game and talks to Archipelago
            - 🗺️ [PopTracker pack — latest](https://github.com/Joxtacy/commander-keen-goodbye-galaxy-ap-tracker/releases/latest) — tracks your items, locations & maps
          files: |
            keen.apworld
            Commander.Keen.yaml
